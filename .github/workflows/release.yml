name: "release"

# Only build when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Branch pushes, pull requests, and manual events do not start builds.
"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Same check the pre-push hook runs locally, plus Cargo.lock.
        run: bun scripts/release-version.ts check --tag "$RELEASE_TAG"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run build

  desktop-verification:
    needs: validate
    uses: ./.github/workflows/verify.yml

  prepare-release:
    needs: [validate, desktop-verification]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              throw new Error(`Release ${tag} is already public; refusing to replace published assets.`);
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Sagaryet ${tag}`,
                body: 'See the assets to download this version and install.',
                draft: true, prerelease: tag.includes('-'),
              }));
            }
            return release.id;

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1 and above)
            args: "--target aarch64-apple-darwin --bundles dmg"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          # Apple targets are only needed on macOS runners.
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test Rust services and HTTP server
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build and upload Tauri app to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri imports the certificate and signs/notarizes on macOS.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }} -- --locked

  publish-release:
    needs: [prepare-release, publish-tauri]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish release after every platform succeeds
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
