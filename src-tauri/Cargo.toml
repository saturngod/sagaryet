[package]
name = "sagaryet"
version = "0.1.0"
description = "OpenAI-compatible text chat bridge"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sagaryet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros", "process", "io-util"] }
async-stream = "0.3"
futures-util = "0.3"
rand = "0.8"
subtle = "2"
tempfile = "3"
libc = "0.2"
if-addrs = "0.15.0"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
